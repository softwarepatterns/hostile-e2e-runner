# Build, smoke, and push hostile-e2e-runner to the Forgejo OCI registry.
#
# Credentials (same contract as ironspecs/rust-builder):
#   Action secret SOPS_AGE_KEY  → decrypts committed .env.enc
#   .env.enc holds FORGEJO_PACKAGES_PAT and optional FORGEJO_PACKAGES_USERNAME
#   (default username: softwarepatterns)
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  BUILDKIT_PROGRESS: plain
  DOCKER_CLI_HINTS: "false"

jobs:
  publish:
    name: publish
    runs-on: bookworm
    steps:
      - name: Environment
        run: |
          set -euo pipefail
          systemctl start docker
          echo "date_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sops: $(sops --version | head -n1)"
          echo "age: $(age --version)"

      - name: Checkout
        uses: https://forgejo.softwarepatterns.com/actions/checkout@v7

      - name: Load secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          : "${SOPS_AGE_KEY:?missing Action secret SOPS_AGE_KEY}"
          sops -d --input-type dotenv --output-type dotenv .env.enc \
            > "${RUNNER_TEMP}/hostile-e2e-runner.env"
          set -a
          # shellcheck disable=SC1090
          source "${RUNNER_TEMP}/hostile-e2e-runner.env"
          set +a
          : "${FORGEJO_PACKAGES_PAT:?FORGEJO_PACKAGES_PAT missing from .env.enc}"
          FORGEJO_PACKAGES_USERNAME="${FORGEJO_PACKAGES_USERNAME:-softwarepatterns}"
          echo "::add-mask::${FORGEJO_PACKAGES_PAT}"
          {
            echo "FORGEJO_PACKAGES_USERNAME<<EOF"
            printf '%s\n' "${FORGEJO_PACKAGES_USERNAME}"
            echo "EOF"
            echo "FORGEJO_PACKAGES_PAT<<EOF"
            printf '%s\n' "${FORGEJO_PACKAGES_PAT}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          REGISTRY=forgejo.softwarepatterns.com
          IMAGE="${REGISTRY}/softwarepatterns/hostile-e2e-runner"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          {
            echo "image=${IMAGE}"
            echo "sha_tag=${IMAGE}:${SHORT_SHA}"
            echo "latest_tag=${IMAGE}:latest"
          } >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
            echo "version_tag=${IMAGE}:${ver}" >> "${GITHUB_OUTPUT}"
          else
            echo "version_tag=" >> "${GITHUB_OUTPUT}"
          fi
          echo "short_sha=${SHORT_SHA}"

      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --progress=plain \
            -t "${{ steps.tags.outputs.sha_tag }}" \
            -t "${{ steps.tags.outputs.latest_tag }}" \
            .
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            docker tag "${{ steps.tags.outputs.sha_tag }}" "${{ steps.tags.outputs.version_tag }}"
          fi

      - name: Smoke
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/examples/minimal:/e2e:ro" \
            -w /e2e \
            "${{ steps.tags.outputs.sha_tag }}" \
            pytest -q

      - name: Login and push
        run: |
          set -euo pipefail
          : "${FORGEJO_PACKAGES_PAT:?}"
          : "${FORGEJO_PACKAGES_USERNAME:?}"
          # Ephemeral docker auth (same idea as rust-builder release-common.sh).
          umask 077
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          printf '%s' "${FORGEJO_PACKAGES_PAT}" | docker login forgejo.softwarepatterns.com \
            -u "${FORGEJO_PACKAGES_USERNAME}" --password-stdin
          docker push "${{ steps.tags.outputs.sha_tag }}"
          docker push "${{ steps.tags.outputs.latest_tag }}"
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            docker push "${{ steps.tags.outputs.version_tag }}"
          fi
          echo "pushed ${{ steps.tags.outputs.sha_tag }}"
          echo "pushed ${{ steps.tags.outputs.latest_tag }}"
