# Build (multi-arch), smoke (native), push hostile-e2e-runner to Forgejo OCI.
#
# Architectures: linux/amd64 + linux/arm64 as one OCI index per tag.
# Unlike rust-builder / services-rs server images, QEMU cross-build is fine
# here (thin Python client; pip wheels for both arches). One job on the box.
#
# Credentials (same contract as ironspecs/rust-builder):
#   Action secret SOPS_AGE_KEY  → decrypts committed .env.enc
#   .env.enc holds FORGEJO_PACKAGES_PAT and optional FORGEJO_PACKAGES_USERNAME
#   (default username: softwarepatterns)
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  BUILDKIT_PROGRESS: plain
  DOCKER_CLI_HINTS: "false"
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    name: publish
    runs-on: bookworm
    steps:
      - name: Environment
        run: |
          set -euo pipefail
          systemctl start docker
          echo "date_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "sops: $(sops --version | head -n1)"
          echo "age: $(age --version)"
          echo "docker: $(docker version --format '{{.Server.Version}}' 2>/dev/null || docker version | head -n1)"
          docker buildx version

      - name: Checkout
        uses: https://forgejo.softwarepatterns.com/actions/checkout@v7

      - name: Load secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          : "${SOPS_AGE_KEY:?missing Action secret SOPS_AGE_KEY}"
          sops -d --input-type dotenv --output-type dotenv .env.enc \
            > "${RUNNER_TEMP}/hostile-e2e-runner.env"
          set -a
          # shellcheck disable=SC1090
          source "${RUNNER_TEMP}/hostile-e2e-runner.env"
          set +a
          : "${FORGEJO_PACKAGES_PAT:?FORGEJO_PACKAGES_PAT missing from .env.enc}"
          FORGEJO_PACKAGES_USERNAME="${FORGEJO_PACKAGES_USERNAME:-softwarepatterns}"
          echo "::add-mask::${FORGEJO_PACKAGES_PAT}"
          {
            echo "FORGEJO_PACKAGES_USERNAME<<EOF"
            printf '%s\n' "${FORGEJO_PACKAGES_USERNAME}"
            echo "EOF"
            echo "FORGEJO_PACKAGES_PAT<<EOF"
            printf '%s\n' "${FORGEJO_PACKAGES_PAT}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          REGISTRY=forgejo.softwarepatterns.com
          IMAGE="${REGISTRY}/softwarepatterns/hostile-e2e-runner"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          {
            echo "image=${IMAGE}"
            echo "sha_tag=${IMAGE}:${SHORT_SHA}"
            echo "latest_tag=${IMAGE}:latest"
          } >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
            echo "version_tag=${IMAGE}:${ver}" >> "${GITHUB_OUTPUT}"
          else
            echo "version_tag=" >> "${GITHUB_OUTPUT}"
          fi
          echo "short_sha=${SHORT_SHA}"

      - name: Multi-arch builder
        run: |
          set -euo pipefail
          # arm64 leg under QEMU on the amd64 box — allowed for this image only.
          docker run --privileged --rm tonistiigi/binfmt --install all
          # docker-container driver can push multi-platform indexes; default
          # "docker" driver cannot.
          if ! docker buildx inspect hostile-multi >/dev/null 2>&1; then
            docker buildx create --name hostile-multi --driver docker-container --use
          else
            docker buildx use hostile-multi
          fi
          docker buildx inspect --bootstrap

      - name: Build native (smoke)
        run: |
          set -euo pipefail
          # Single-platform load so we can docker run before pushing the index.
          docker build \
            --progress=plain \
            -t "hostile-e2e-runner:smoke" \
            -t "${{ steps.tags.outputs.sha_tag }}" \
            .

      - name: Smoke
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/examples/minimal:/e2e:ro" \
            -w /e2e \
            hostile-e2e-runner:smoke \
            pytest -q

      - name: Login and multi-arch push
        run: |
          set -euo pipefail
          : "${FORGEJO_PACKAGES_PAT:?}"
          : "${FORGEJO_PACKAGES_USERNAME:?}"
          umask 077
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
          printf '%s' "${FORGEJO_PACKAGES_PAT}" | docker login forgejo.softwarepatterns.com \
            -u "${FORGEJO_PACKAGES_USERNAME}" --password-stdin

          tags=(
            -t "${{ steps.tags.outputs.sha_tag }}"
            -t "${{ steps.tags.outputs.latest_tag }}"
          )
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            tags+=(-t "${{ steps.tags.outputs.version_tag }}")
          fi

          # One OCI index per tag: amd64 (native) + arm64 (QEMU). --push is
          # required for multi-platform; --load cannot materialize an index.
          docker buildx build \
            --builder hostile-multi \
            --platform "${PLATFORMS}" \
            --progress=plain \
            "${tags[@]}" \
            --push \
            .

          echo "pushed multi-arch (${PLATFORMS}):"
          echo "  ${{ steps.tags.outputs.sha_tag }}"
          echo "  ${{ steps.tags.outputs.latest_tag }}"
          if [[ -n "${{ steps.tags.outputs.version_tag }}" ]]; then
            echo "  ${{ steps.tags.outputs.version_tag }}"
          fi
